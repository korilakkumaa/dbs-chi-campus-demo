# Google Calendar backend sync — every 3 hours.
# Requires repo secrets: VITE_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# CALENDAR_SYNC_CRON_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# (Google OAuth client from the same project as Supabase Google provider).

name: Sync Google Calendar

on:
  schedule:
    # Every 3 hours at :00 UTC
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger calendar-sync-google Edge Function
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CALENDAR_SYNC_CRON_SECRET: ${{ secrets.CALENDAR_SYNC_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${CALENDAR_SYNC_CRON_SECRET:-}" ]; then
            echo "Missing required secrets."
            exit 1
          fi
          curl -fsS -X POST "${SUPABASE_URL%/}/functions/v1/calendar-sync-google" \
            -H "Authorization: Bearer ${CALENDAR_SYNC_CRON_SECRET}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
